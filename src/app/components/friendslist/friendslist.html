<section class="card" id="amis">
  <div class="icon">👥</div>
  <div>
    <h2>Liste des amis</h2>
    @for(elem of friends; track elem.name) {
      <input type="text" [(ngModel)]="elem.name" />
    }
    
    <ul>
        @for(elem of friends; track elem.name) {
          <li>{{elem.name}}</li>
        }
    </ul>
  </div>
</section>
